<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProjectVerse</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="auth.js"></script>
</head>
<body class="projectverse-home">
    <header class="home-header">
        <a class="home-brand" href="./">ProjectVerse</a>
        <nav class="home-actions" aria-label="Account">
            <a href="login.html">Log in</a>
            <button id="logoutBtn" type="button" hidden>Log out</button>
        </nav>
    </header>
    <main class="home-main">
        <section class="home-intro" aria-labelledby="home-title">
            <p class="home-label">A space for student builders</p>
            <h1 id="home-title">Your ideas deserve a universe.</h1>
            <p>Start with an idea, and build your next project with ProjectVerse.</p>
            <a class="home-cta" href="signup.html">Create an account</a>
        </section>
        <section class="home-profile" id="dashboardProfile" aria-labelledby="dashboardName" hidden>
            <h2 id="dashboardName">Your profile</h2>
            <dl>
                <dt>Email</dt><dd id="dashboardEmail"></dd>
                <dt>Branch</dt><dd id="dashboardBranch"></dd>
                <dt>Year</dt><dd id="dashboardYear"></dd>
                <dt>Skills added</dt><dd id="dashboardSkills"></dd>
            </dl>
        </section>
        <p id="toast" role="status"></p>
    </main>
</body>
</html>
