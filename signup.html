<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ProjectVerse | Create Account</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">

<div class="auth-container">

    <div class="auth-brand">

        <div class="brand-mark">
            ✦
        </div>

        <h1>
            Join ProjectVerse
        </h1>

        <p>
            Build. Connect. Create.
        </p>

    </div>


    <div class="auth-card">

        <span class="pill">
            CREATE ACCOUNT
        </span>

        <h2>
            Start your builder journey
        </h2>

        <p class="auth-subtitle">
            Create your student profile.
        </p>


        <form id="signupForm">

            <label>Full Name</label>

            <input
                id="signupName"
                type="text"
                placeholder="Your name"
                required
            >


            <label>Email</label>

            <input
                id="signupEmail"
                type="email"
                placeholder="you@example.com"
                required
            >


            <label>Password</label>

            <input
                id="signupPassword"
                type="password"
                placeholder="Create a password"
                minlength="6"
                required
            >


            <label>Branch</label>

            <select id="signupBranch">

                <option>CSD</option>
                <option>CSE</option>
                <option>AIML</option>
                <option>AIDS</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>IT</option>

            </select>


            <label>Year</label>

            <select id="signupYear">

                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>

            </select>


            <button
                class="primary full"
                type="submit">

                Create Account 🚀

            </button>

        </form>


        <p class="auth-switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>


    <a
        href="index.html"
        class="back-home">

        ← Back to ProjectVerse

    </a>

</div>


<div id="toast"></div>


<script type="module" src="auth.js"></script>

</body>
</html>
